[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graph_project"
version = "0.1.0"
description = "Node + Edge + Graph + JSON-LD parser project"
authors = [
    { name = "Izza Qamar , Martin Braaten Kildal, Philip Adrian Kern Øvland" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]